services:
  postgres:
    image: postgres:16-alpine
    container_name: openring-postgres
    environment:
      POSTGRES_USER: openring
      POSTGRES_PASSWORD: openring
      POSTGRES_DB: openring
    ports:
      - "5432:5432"
    volumes:
      - openring_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openring -d openring"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openring-backend
    environment:
      PORT: 4000
      NODE_ENV: production
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: openring
      DATABASE_PASSWORD: openring
      DATABASE_NAME: openring
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_GRAPHQL_URL: http://localhost:4000/graphql
    container_name: openring-frontend
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  openring_pgdata:
